<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando post...</title>
    <link rel="icon" href="/assets/images/logo.png" type="image/png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Montserrat&family=Open+Sans&family=Roboto&display=swap" rel="stylesheet">
    <!-- Font Awesome para iconos de redes sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html">
                <img id="site-logo" src="assets/images/logo.png" alt="Logo" class="logo">
            </a>
            <nav id="main-nav">
                <!-- El menú se generará dinámicamente aquí -->
            </nav>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-checkbox">
                    <input type="checkbox" id="theme-checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="post-container" class="post-item">
            <!-- El contenido del post se cargará aquí -->
        </div>

        <section id="comments-section">
            <h2>Comentarios</h2>
            <form id="comment-form">
                <div class="form-group">
                    <label for="author_name">Nombre</label>
                    <input type="text" id="author_name" required>
                </div>
                <div class="form-group">
                    <label for="comment_content">Tu comentario</label>
                    <textarea id="comment_content" rows="4" required></textarea>
                </div>
                <button type="submit">Enviar Comentario</button>
            </form>
            <div id="comments-list">
                <!-- La lista de comentarios se cargará aquí -->
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p id="footer-text-content">Cargando...</p>
            <div id="social-links-container" class="social-links"></div>
        </div>
    </footer>

    <!-- Reutilizamos el script principal para cargar menú y configuraciones -->
    <script src="/assets/js/main.js"></script>

    <button id="back-to-top-btn" title="Volver arriba">↑</button>
</body>
</html>
