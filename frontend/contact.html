<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css?v=1.0.1">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html">
                <img id="site-logo" src="assets/images/logo.png" alt="Logo" class="logo">
            </a>
            <nav id="main-nav">
                <!-- El menú se generará dinámicamente aquí -->
            </nav>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="theme-checkbox">
                    <input type="checkbox" id="theme-checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="contact-section">
            <h1>Contacto</h1>
            <p>¿Tienes alguna pregunta o propuesta? Rellena el formulario y me pondré en contacto contigo lo antes posible.</p>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Tu Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" rows="6" required></textarea>
                </div>
                <button type="submit">Enviar Mensaje</button>
                <p id="form-status"></p>
            </form>
        </section>
    </main>

    <script src="assets/js/main.js"></script> 
    <script src="assets/js/contact.js"></script>
</body>
</html>
